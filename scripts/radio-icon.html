<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; }
    .icon {
      position: relative;
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      container-type: size;
      background:
        radial-gradient(circle at 22% 24%, rgba(255,255,255,.1), transparent 42%),
        repeating-radial-gradient(circle at 58% 42%, #4A3220 0 10px, #5C3F28 10px 14px),
        #4A3220;
    }
    .icon::before {
      content: "";
      position: absolute;
      inset: 11%;
      border-radius: 12%;
      pointer-events: none;
      border: 7px dashed rgba(217, 201, 168, 0.58);
    }
    .mark {
      position: absolute;
      inset: 18%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7%;
    }
    .honey {
      position: relative;
      width: 28%;
      height: 28%;
      flex-shrink: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #F7E19A, #F4B400 55%, #B8860B);
      box-shadow:
        0 10px 0 #7A5A08,
        inset 0 4px 0 rgba(255,255,255,.55);
    }
    .honey .tick {
      position: absolute;
      left: 50%;
      top: 10%;
      width: 6%;
      height: 14%;
      transform: translateX(-50%);
      border-radius: 2px;
      background: #3E2F20;
      opacity: 0.35;
    }
    .honey .needle {
      position: absolute;
      left: 50%;
      top: 18%;
      width: 8%;
      height: 42%;
      transform: translateX(-50%) rotate(38deg);
      transform-origin: 50% 90%;
      border-radius: 3px 3px 40% 40%;
      background: #D64530;
      box-shadow: 0 0 8px rgba(214, 69, 48, 0.55);
    }
    .honey .hub {
      position: absolute;
      left: 50%;
      top: 54%;
      width: 14%;
      height: 14%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #3E2F20;
    }
    .word {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 14.5cqmin;
      letter-spacing: 0.14em;
      line-height: 1;
      color: #EFE3C8;
      text-indent: 0.14em;
      text-shadow: 0 0.5cqmin 0 rgba(0,0,0,.62), 0 -0.2cqmin 0 rgba(255,255,255,.14);
    }
    .splash {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4.2vh;
      background: #6B4F36;
    }
    .splash .badge {
      width: min(38vw, 220px);
      height: min(38vw, 220px);
      border-radius: 22%;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
    }
    .splash .badge .icon {
      width: 100%;
      height: 100%;
    }
    .splash .title {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: min(7.2vw, 42px);
      letter-spacing: 0.28em;
      color: #EFE3C8;
      text-indent: 0.28em;
      text-shadow: 0 2px 0 rgba(0,0,0,.45);
    }
  </style>
</head>
<body>
  <div id="icon" class="icon">
    <div class="mark">
      <div class="honey" aria-hidden>
        <span class="tick"></span>
        <span class="needle"></span>
        <span class="hub"></span>
      </div>
      <div class="word">LATIGO</div>
    </div>
  </div>
  <div id="splash" class="splash" hidden>
    <div class="badge">
      <div class="icon">
        <div class="mark">
          <div class="honey" aria-hidden>
            <span class="tick"></span>
            <span class="needle"></span>
            <span class="hub"></span>
          </div>
          <div class="word">LATIGO</div>
        </div>
      </div>
    </div>
    <div class="title">LATIGO RADIO</div>
  </div>
</body>
</html>
